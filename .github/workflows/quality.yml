name: Quality

on: [push, pull_request]

jobs:
  unit-and-migrations:
    runs-on: ubuntu-latest
    env:
      MYSQL_PORT: '3307'
      TEST_MYSQL_URL: 'jdbc:mysql://127.0.0.1:3307/e_store_integration?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC'
      TEST_MYSQL_USER: root
      TEST_MYSQL_PASSWORD: '123456'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test_repository_contracts.py
      - run: python -m pip install -r scripts/requirements.txt
      - run: python scripts/validate_openapi.py
      - run: docker compose run --rm migrate migrate
      - run: docker compose run --rm migrate validate
      - run: docker compose run --rm migrate migrate
      - name: Create disposable integration schema
        run: docker compose exec -T database sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -uroot -e "CREATE DATABASE e_store_integration"'
      - run: mvn -B -Pmysql-integration clean verify
      - run: mvn -B -Plegacy-integration test
      - run: python -m pip install -r scripts/requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - name: Verify browser security and demo shopping journey
        run: python scripts/run_browser_smoke.py
        env:
          STORE_DATABASE_E2E: '1'
          MYSQL_CONNECTION_STRING: '${{ env.TEST_MYSQL_URL }}'
          MYSQL_USER: root
          MYSQL_PASSWORD: '${{ env.TEST_MYSQL_PASSWORD }}'
          ALLOW_DEMO_CHECKOUT: 'true'
      - name: Verify checkout is blocked without demo mode
        run: python scripts/run_browser_smoke.py
        env:
          STORE_DATABASE_E2E: '1'
          MYSQL_CONNECTION_STRING: '${{ env.TEST_MYSQL_URL }}'
          MYSQL_USER: root
          MYSQL_PASSWORD: '${{ env.TEST_MYSQL_PASSWORD }}'
          ALLOW_DEMO_CHECKOUT: 'false'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-coverage-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
            target/browser-server.log
      - name: Collect database logs
        if: failure()
        run: docker compose logs database
      - name: Stop services
        if: always()
        run: docker compose down -v
