name: e-store

services:
  app:
    image: maven:3.9-eclipse-temurin-8
    working_dir: /workspace
    command: >
      sh -c "mvn -B clean package
      && java -jar target/dependency/webapp-runner.jar
      --port ${MVN_PORT:-8181} target/e-store-1.0.1.war"
    volumes:
      - ./:/workspace
      - maven-cache:/root/.m2
    ports:
      - "${MVN_PORT:-8181}:${MVN_PORT:-8181}"
    environment:
      MYSQL_CONNECTION_STRING: jdbc:mysql://database:3306/${MYSQL_DATABASE:-e_store}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      MYSQL_USER: ${MYSQL_USER:-e_store}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456}
      ALLOW_DEMO_CHECKOUT: "true"
      # Demo email adapter: reset links are written as text files here (not production ready).
      EMAIL_OUTBOX_DIR: /workspace/outbox
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    image: flyway/flyway:9.22.3
    command: migrate
    volumes:
      - ./database/migrations:/flyway/sql/schema:ro
      - ./database/dev-seeds:/flyway/sql/dev:ro
    environment:
      FLYWAY_URL: jdbc:mysql://database:3306/${MYSQL_DATABASE:-e_store}?useSSL=false&allowPublicKeyRetrieval=true
      FLYWAY_USER: ${MYSQL_USER:-e_store}
      FLYWAY_PASSWORD: ${MYSQL_PASSWORD:-123456}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql/schema,filesystem:/flyway/sql/dev
      FLYWAY_CLEAN_DISABLED: "true"
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mysql:8.4.13
    restart: unless-stopped
    command: --skip-log-bin
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data-v8:/var/lib/mysql
      - ./database/mycustom.cnf:/etc/mysql/conf.d/custom.cnf:ro
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-e_store}
      MYSQL_USER: ${MYSQL_USER:-e_store}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
    healthcheck:
      # The password is read from the container environment, not the command line, and the
      # start period covers first-run data directory initialization on slower machines.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 30

volumes:
  mysql-data-v8:
  maven-cache:
