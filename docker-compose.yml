name: e-store

services:
  app:
    image: maven:3.9-eclipse-temurin-8
    working_dir: /workspace
    command: >
      sh -c "mvn -B clean package
      && java -jar target/dependency/webapp-runner.jar
      --port ${MVN_PORT:-8181} target/loja-1.0.1.war"
    volumes:
      - ./:/workspace
      - maven-cache:/root/.m2
    ports:
      - "${MVN_PORT:-8181}:${MVN_PORT:-8181}"
    environment:
      MYSQL_CONNECTION_STRING: jdbc:mysql://database:3306/${MYSQL_DATABASE:-e_store}?useSSL=false&serverTimezone=UTC
      MYSQL_USER: ${MYSQL_USER:-e_store}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456}
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mysql:5.7
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/dump:/docker-entrypoint-initdb.d:ro
      - ./database/mycustom.cnf:/etc/mysql/conf.d/custom.cnf:ro
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-e_store}
      MYSQL_USER: ${MYSQL_USER:-e_store}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
  maven-cache:
